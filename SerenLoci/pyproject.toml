[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seren-loci"
dynamic = ["version"]
description = "Keyed facts/logic memory for Seren. The left brain - addressable, deterministic, one live value per key."
readme = "README.md"
# Upper bound mirrors SerenMemory, but the REASON differs: Loci's floor (exact
# + FTS5) is pure sqlite + the web stack and would run fine anywhere. The cap
# exists for the OPTIONAL [vector] extra - sentence-transformers pulls torch,
# and torch's 3.13 wheel gap is the wall. Capping here keeps `pip install
# seren-loci[vector]` resolving cleanly instead of exploding on a torch build.
# LIFT THE <3.13 the day torch ships 3.13 wheels (bump the CI matrix to match
# in the same commit).
requires-python = ">=3.10,<3.13"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Chad Roesler" }]
keywords = ["llm", "memory", "facts", "logic", "sqlite", "sqlite-vec", "seren"]

# THE FLOOR IS DEP-LIGHT ON PURPOSE. Exact-key + FTS5 lexical search need
# nothing but sqlite (stdlib) and the web stack. The associative vector finder
# - sqlite-vec + sentence-transformers - is the [vector] extra below, so the
# Nano / 4GB-laptop floor never pulls torch unless an operator opts into the
# "this smells like that CUDA thing" jump. Structural opt-in: capability by
# install choice, not a runtime flag.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    # The shared Seren core: token resolution, config/version helpers, the auth
    # middleware, the viewer baseplate. Pinned <1 so a MAJOR (a security change
    # that can't be defaulted) is the only thing that ever forces a bump here.
    "seren-meninges>=2.1.0,<3",
    # Shared request logging - one copy across the family (SerenSinew). Mounted
    # outermost (before auth) so even 401s get logged. -> loci-requests.log.
    "seren-sinew>=1.0.0,<2",
]

[project.optional-dependencies]
vector = [
    # The associative finder. sqlite-vec is the index (MIT/Apache, pure C,
    # ~60KB, arm64 wheels exist - drops onto Jetson without the build saga);
    # it's brute-force KNN, which is CORRECT for a facts table this size, not a
    # compromise. sentence-transformers turns fact text into the vectors it
    # searches. Pinned >=0.1.6 (sqlite-vec is on the 0.1.x line; a >=1.0 pin
    # would never resolve). Opt-in: `pip install seren-loci[vector]`.
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.0",
]
mcp = [
    # The Python MCP SDK from Anthropic (FastMCP merged in). Lets a connected
    # Rhys set_fact/get_fact/search the left brain directly.
    #
    # THE <2 CAP IS LOAD-BEARING: mcp 2.0.0 REMOVED FastMCP outright.
    # `mcp.server.fastmcp` does not exist in 2.x; the server class is now
    # mcp.server.mcpserver.MCPServer with a different API. Last 1.x that
    # still carries FastMCP is 1.29.0. Uncapped, a fresh install resolves
    # 2.0.0, the import fails, the ImportError gate catches it exactly as
    # designed, and the service comes up in HTTP-only mode with one log
    # line - i.e. /mcp silently ceases to exist and looks like the extra
    # just wasn't installed. Cap it, don't hope.
    #
    # Lift the cap in the same commit that ports the server to the MCPServer
    # API - across the whole family at once, since they're copies. Within
    # 1.x the pin stays loose: our server tolerates transport-name drift.
    "mcp>=1.0,<2",
]
corp = [
    # Corporate / intercepting-proxy support. Routes Python TLS through the OS
    # trust store so a corp root CA (Zscaler/Netskope/etc.) is honored without
    # hand-exporting .pem files. Opt-in: `pip install seren-loci[corp]` +
    # tls.trust_system_store: true (the --corp installer flag sets both).
    "truststore>=0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # silences the starlette->httpx deprecation warning under fastapi.testclient
    # and future-proofs the test stack against the hard cutover (same as memory).
    "httpx2>=2.3",
]
# "is there a newer seren-lodestar" reporting on GET /. Opt-in, because a
# service that never leaves a LAN has no reason to talk to PyPI. Pulls the
# Meninges extra rather than httpx/packaging directly - the check lives in
# seren_meninges.updates and only one repo should own that dep set.
#
# The floor matches the core dep above: updates.py landed in 2.0.0 and updates_payload in 2.1.0.
# Resolve anything older and the lifespan import fails, leaving you with
# status="unavailable" forever and no obvious reason why.
updates = ["seren-meninges[updates]>=2.1.0,<3"]

[project.scripts]
seren-loci = "seren_loci.__main__:main"

[project.urls]
Homepage = "https://github.com/ChadRoesler/SerenLoci"
Repository = "https://github.com/ChadRoesler/SerenLoci"
"Bug Tracker" = "https://github.com/ChadRoesler/SerenLoci/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["seren_loci*"]

# Ship the viewer HTML inside the wheel when it lands. Same gotcha as
# SerenMemory: pip strips non-.py files, so GET /viewer would 404 on an
# installed copy without this. Harmless before the viewer exists (the glob just
# matches nothing).
[tool.setuptools.package-data]
seren_loci = ["viewer/ui/*.html", "viewer/ui/*.css", "viewer/ui/*.js"]

[tool.setuptools_scm]
# .git is one level above pyproject.toml (repo root, not the SerenLoci subdir)
root = ".."
version_scheme = "release-branch-semver"
# Write the tag-derived version into the package (shipped in the wheel, read
# by __init__ / importlib.metadata). Replaces the old sed-on-__init__ hack -
# version now flows from the git tag with no manual step. _version.py is
# gitignored; it's a build artifact, never committed.
version_file = "seren_loci/_version.py"
# Strip the leading 'v' so "v1.2.3" → "1.2.3"
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+.*)$"
# Used when no git tags exist (local dev, fresh clone). CI release builds
# override with SETUPTOOLS_SCM_PRETEND_VERSION.
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
